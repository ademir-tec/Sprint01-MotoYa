<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1140" viewBox="0 0 1780 1140"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#40556b"/></marker></defs><rect width="1780" height="1140" fill="white"/><g font-family="Arial, sans-serif"><text x="60" y="55" font-size="36" font-weight="700" fill="#1b2a3a" text-anchor="start">MotoYa · Estilo arquitectónico</text><text x="60" y="94" font-size="24" font-weight="400" fill="#526478" text-anchor="start">Cliente-servidor con backend serverless administrado por Firebase</text><text x="80" y="165" font-size="18" font-weight="700" fill="#526478" text-anchor="start">CLIENTES</text><text x="660" y="165" font-size="18" font-weight="700" fill="#526478" text-anchor="start">SERVIDOR</text><text x="1220" y="165" font-size="18" font-weight="700" fill="#526478" text-anchor="start">SERVICIOS</text><rect x="80" y="210" width="400" height="150" rx="14" fill="#edf5ff" stroke="#679bc8" stroke-width="2"/><text x="104" y="245" font-size="24" font-weight="700" fill="#1b2a3a" text-anchor="start">App móvil</text><text x="104" y="280" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Flutter / Dart</text><text x="104" y="308" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">GPS, puntos y visualización</text><text x="104" y="336" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Solicita y muestra la cotización</text><rect x="80" y="480" width="400" height="150" rx="14" fill="#edf5ff" stroke="#679bc8" stroke-width="2"/><text x="104" y="515" font-size="24" font-weight="700" fill="#1b2a3a" text-anchor="start">Panel administrativo</text><text x="104" y="550" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Flutter Web / Dart</text><text x="104" y="578" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Personal autorizado</text><text x="104" y="606" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Consultas y comandos por rol</text><rect x="660" y="310" width="400" height="240" rx="14" fill="#eaf7ed" stroke="#6da67b" stroke-width="2"/><text x="684" y="345" font-size="24" font-weight="700" fill="#1b2a3a" text-anchor="start">Backend MotoYa</text><text x="684" y="380" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Cloud Functions / TypeScript</text><text x="684" y="408" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Obtiene ruta y distancia</text><text x="684" y="436" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Calcula tarifa y comisión</text><text x="684" y="464" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Valida permisos y estados</text><text x="684" y="492" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Conserva cotización con quoteId</text><rect x="1220" y="210" width="480" height="140" rx="14" fill="#fff3df" stroke="#c0a16b" stroke-width="2"/><text x="1244" y="245" font-size="24" font-weight="700" fill="#1b2a3a" text-anchor="start">Proveedor de rutas</text><text x="1244" y="280" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Recorrido, distancia y duración</text><text x="1244" y="308" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Clave de servidor en Secret Manager</text><rect x="1220" y="440" width="480" height="140" rx="14" fill="#f1edff" stroke="#9c85bf" stroke-width="2"/><text x="1244" y="475" font-size="24" font-weight="700" fill="#1b2a3a" text-anchor="start">Cloud Firestore</text><text x="1244" y="510" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Base de datos NoSQL documental</text><text x="1244" y="538" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Cotizaciones, solicitudes y viajes</text><rect x="1220" y="670" width="480" height="140" rx="14" fill="#ffedf1" stroke="#c68a9a" stroke-width="2"/><text x="1244" y="705" font-size="24" font-weight="700" fill="#1b2a3a" text-anchor="start">Auth, Storage y FCM</text><text x="1244" y="740" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Identidad, archivos privados y avisos</text><text x="1244" y="768" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Acceso según permisos</text><rect x="80" y="735" width="400" height="140" rx="14" fill="#edf7f1" stroke="#76a38a" stroke-width="2"/><text x="104" y="770" font-size="24" font-weight="700" fill="#1b2a3a" text-anchor="start">Mapa en la app</text><text x="104" y="805" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">SDK de visualización</text><text x="104" y="833" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Clave restringida por aplicación/API</text><rect x="660" y="735" width="400" height="140" rx="14" fill="#ecf7ff" stroke="#7da5c5" stroke-width="2"/><text x="684" y="770" font-size="24" font-weight="700" fill="#1b2a3a" text-anchor="start">Mercado Pago</text><text x="684" y="805" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Recargas de saldo del conductor</text><text x="684" y="833" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Validación y acreditación en backend</text><path d="M480,285 L565,285 L565,370 L660,370" fill="none" stroke="#40556b" stroke-width="2.5" marker-end="url(#a)"/><rect x="502.5" y="231" width="95" height="30" rx="5" fill="white"/><text x="550" y="253" font-size="18" font-weight="400" fill="#40556b" text-anchor="middle">HTTPS</text><path d="M480,555 L565,555 L565,490 L660,490" fill="none" stroke="#40556b" stroke-width="2.5" marker-end="url(#a)"/><rect x="502.5" y="577" width="95" height="30" rx="5" fill="white"/><text x="550" y="599" font-size="18" font-weight="400" fill="#40556b" text-anchor="middle">HTTPS</text><path d="M1060,365 L1135,365 L1135,280 L1220,280" fill="none" stroke="#40556b" stroke-width="2.5" marker-end="url(#a)"/><rect x="1095.0" y="231" width="80" height="30" rx="5" fill="white"/><text x="1135" y="253" font-size="18" font-weight="400" fill="#40556b" text-anchor="middle">Ruta</text><path d="M1060,500 L1220,500" fill="none" stroke="#40556b" stroke-width="2.5" marker-end="url(#a)"/><rect x="1097.5" y="458" width="85" height="30" rx="5" fill="white"/><text x="1140" y="480" font-size="18" font-weight="400" fill="#40556b" text-anchor="middle">Datos</text><path d="M1060,530 L1135,530 L1135,740 L1220,740" fill="none" stroke="#40556b" stroke-width="2.5" marker-end="url(#a)"/><rect x="1085.0" y="612" width="100" height="30" rx="5" fill="white"/><text x="1135" y="634" font-size="18" font-weight="400" fill="#40556b" text-anchor="middle">Servicios</text><path d="M860,550 L860,735" fill="none" stroke="#40556b" stroke-width="2.5" marker-end="url(#a)"/><rect x="810.0" y="630" width="100" height="30" rx="5" fill="white"/><text x="860" y="652" font-size="18" font-weight="400" fill="#40556b" text-anchor="middle">Recargas</text><path d="M80,290 L35,290 L35,805 L80,805" fill="none" stroke="#40556b" stroke-width="2.5" marker-end="url(#a)"/><rect x="60" y="925" width="1660" height="155" rx="14" fill="#f5f7fa" stroke="#ccd5df" stroke-width="2"/><text x="85" y="961" font-size="23" font-weight="700" fill="#1b2a3a" text-anchor="start">Responsabilidad de cada parte</text><text x="85" y="995" font-size="21" font-weight="400" fill="#1b2a3a" text-anchor="start">El cliente envía puntos y muestra resultados. El backend consulta la ruta y determina los kilómetros y la tarifa.</text><text x="85" y="1026" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">App y panel también utilizan Auth y accesos directos a datos permitidos por reglas.</text><text x="85" y="1057" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Serverless: Firebase administra la ejecución. Las capas internas se explican en el enfoque de Arquitectura Limpia.</text></g></svg>