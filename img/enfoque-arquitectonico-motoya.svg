<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1630" viewBox="0 0 1900 1630"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#344658"/></marker></defs><rect width="1900" height="1630" fill="white"/><g font-family="Arial, sans-serif"><text x="50" y="48" font-size="34" font-weight="700" fill="#18232f" text-anchor="start">MotoYa · Enfoque arquitectónico</text><text x="50" y="82" font-size="22" font-weight="400" fill="#526478" text-anchor="start">Arquitectura Limpia · Reglas de negocio independientes de pantallas, Firebase y proveedores externos</text><rect x="230" y="110" width="240" height="50" rx="9" fill="#f4f6f8" stroke="#8191a3" stroke-width="2"/><text x="350" y="142" font-size="19" font-weight="700" fill="#18232f" text-anchor="middle">PASAJERO</text><rect x="730" y="110" width="240" height="50" rx="9" fill="#f4f6f8" stroke="#8191a3" stroke-width="2"/><text x="850" y="142" font-size="19" font-weight="700" fill="#18232f" text-anchor="middle">CONDUCTOR</text><rect x="1340" y="110" width="340" height="50" rx="9" fill="#f4f6f8" stroke="#8191a3" stroke-width="2"/><text x="1510" y="142" font-size="19" font-weight="700" fill="#18232f" text-anchor="middle">ADMINISTRADOR / SOPORTE</text><path d="M350,160 L620,195" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M850,160 L620,195" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M1510,160 L1510,195" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="200" y="195" width="840" height="145" rx="9" fill="#edf5ff" stroke="#538bc0" stroke-width="2"/><text x="620.0" y="225" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">App móvil · Flutter / Dart</text><text x="620.0" y="253" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Una app: modo pasajero y modo conductor</text><text x="620.0" y="276" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">presentation → application → domain</text><text x="620.0" y="299" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">data implementa contratos; composition conecta dependencias</text><rect x="1130" y="195" width="720" height="145" rx="9" fill="#edf5ff" stroke="#538bc0" stroke-width="2"/><text x="1490.0" y="225" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Panel web · Flutter / Dart</text><text x="1490.0" y="253" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Conductores, usuarios, recargas, soporte y tarifas</text><text x="1490.0" y="276" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Capas: presentation, application, domain y data</text><text x="1490.0" y="299" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Acceso del personal según sus permisos</text><path d="M620,340 L620,422" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M1490,340 L1490,422" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)"/><text x="950" y="376" font-size="19" font-weight="400" fill="#18232f" text-anchor="middle">HTTPS · funciones callable / HTTP · identidad de Firebase Auth</text><rect x="30" y="395" width="1840" height="795" rx="9" fill="#fff" stroke="#344658" stroke-width="2" stroke-dasharray="9 6"/><text x="55" y="427" font-size="23" font-weight="700" fill="#18232f" text-anchor="start">BACKEND MOTOYA · Firebase Cloud Functions · TypeScript / Node.js</text><text x="55" y="455" font-size="18" font-weight="400" fill="#526478" text-anchor="start">Funciones administradas por Firebase; el esquema no representa un único proceso ni un monolito Express.</text><rect x="50" y="475" width="1800" height="120" rx="9" fill="#eaf3ff" stroke="#679bc8" stroke-width="2"/><text x="70" y="507" font-size="20" font-weight="700" fill="#18232f" text-anchor="start">1. PRESENTACIÓN</text><text x="70" y="541" font-size="17" font-weight="400" fill="#18232f" text-anchor="start">Entradas y respuestas</text><text x="70" y="564" font-size="17" font-weight="400" fill="#18232f" text-anchor="start">Validación de identidad</text><rect x="50" y="610" width="1800" height="170" rx="9" fill="#eef8ec" stroke="#83ad74" stroke-width="2"/><text x="70" y="642" font-size="20" font-weight="700" fill="#18232f" text-anchor="start">2. APLICACIÓN</text><text x="70" y="676" font-size="17" font-weight="400" fill="#18232f" text-anchor="start">Casos de uso</text><text x="70" y="699" font-size="17" font-weight="400" fill="#18232f" text-anchor="start">Coordina operaciones</text><rect x="50" y="795" width="1800" height="150" rx="9" fill="#fff4d7" stroke="#c4a04a" stroke-width="2"/><text x="70" y="827" font-size="20" font-weight="700" fill="#18232f" text-anchor="start">3. DOMINIO</text><text x="70" y="861" font-size="17" font-weight="400" fill="#18232f" text-anchor="start">Reglas del negocio</text><text x="70" y="884" font-size="17" font-weight="400" fill="#18232f" text-anchor="start">Sin SDK de Firebase</text><rect x="50" y="960" width="1800" height="195" rx="9" fill="#f1eefe" stroke="#9880ba" stroke-width="2"/><text x="70" y="992" font-size="20" font-weight="700" fill="#18232f" text-anchor="start">4. INFRAESTRUCTURA</text><text x="70" y="1026" font-size="17" font-weight="400" fill="#18232f" text-anchor="start">Adaptadores externos</text><text x="70" y="1049" font-size="17" font-weight="400" fill="#18232f" text-anchor="start">Implementa los puertos</text><rect x="330" y="490" width="1460" height="88" rx="9" fill="#fff" stroke="#679bc8" stroke-width="2"/><text x="1060.0" y="520" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">firebase_endpoints.ts</text><text x="1060.0" y="548" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Autenticación · permisos · datos de entrada · manejo de errores · entrada a los casos de uso</text><rect x="330" y="635" width="350" height="95" rx="9" fill="#fff" stroke="#83ad74" stroke-width="2"/><text x="505.0" y="665" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Cuentas y perfiles</text><text x="505.0" y="693" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">accounts.ts / profile_store.ts</text><text x="505.0" y="716" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Cuenta, alias y perfil</text><path d="M505.0,578 L505.0,635" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="330" y="815" width="350" height="100" rx="9" fill="#fff" stroke="#c4a04a" stroke-width="2"/><text x="505.0" y="845" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Reglas de dominio</text><text x="505.0" y="873" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">profile_rules.ts / accounts.ts</text><text x="505.0" y="896" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Identidad y reglas de perfil</text><path d="M505.0,730 L505.0,815" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="700" y="635" width="350" height="95" rx="9" fill="#fff" stroke="#83ad74" stroke-width="2"/><text x="875.0" y="665" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Viajes y tarifas</text><text x="875.0" y="693" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">trips.ts / pricing.ts</text><text x="875.0" y="716" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Estados, PIN y tarifa</text><path d="M875.0,578 L875.0,635" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="700" y="815" width="350" height="100" rx="9" fill="#fff" stroke="#c4a04a" stroke-width="2"/><text x="875.0" y="845" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Reglas de dominio</text><text x="875.0" y="873" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">trips.ts / pricing.ts</text><text x="875.0" y="896" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Transiciones y cálculo de tarifa</text><path d="M875.0,730 L875.0,815" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="1070" y="635" width="350" height="95" rx="9" fill="#fff" stroke="#83ad74" stroke-width="2"/><text x="1245.0" y="665" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Conductores y saldo</text><text x="1245.0" y="693" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">registration.ts / wallet.ts</text><text x="1245.0" y="716" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Expediente, saldo y recargas</text><path d="M1245.0,578 L1245.0,635" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="1070" y="815" width="350" height="100" rx="9" fill="#fff" stroke="#c4a04a" stroke-width="2"/><text x="1245.0" y="845" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Reglas de dominio</text><text x="1245.0" y="873" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">registration.ts / wallet.ts</text><text x="1245.0" y="896" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Reglas de conductor y dinero</text><path d="M1245.0,730 L1245.0,815" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="1440" y="635" width="350" height="95" rx="9" fill="#fff" stroke="#83ad74" stroke-width="2"/><text x="1615.0" y="665" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Administración</text><text x="1615.0" y="693" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">staff.ts / cases.ts</text><text x="1615.0" y="716" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Personal, permisos y atención</text><path d="M1615.0,578 L1615.0,635" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="1440" y="815" width="350" height="100" rx="9" fill="#fff" stroke="#c4a04a" stroke-width="2"/><text x="1615.0" y="845" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Reglas de dominio</text><text x="1615.0" y="873" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">staff.ts / cases.ts</text><text x="1615.0" y="896" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Roles y reglas de atención</text><path d="M1615.0,730 L1615.0,815" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)"/><text x="70" y="725" font-size="17" font-weight="700" fill="#18232f" text-anchor="start">Contratos internos:</text><text x="70" y="749" font-size="17" font-weight="400" fill="#18232f" text-anchor="start">application/ports.ts</text><rect x="330" y="985" width="1460" height="105" rx="9" fill="#fff" stroke="#9880ba" stroke-width="2"/><text x="1060.0" y="1015" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Adaptadores Firebase y servicios externos</text><text x="1060.0" y="1043" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">firebase_store.ts · notifications.ts · mercadopago.ts</text><text x="1060.0" y="1066" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Persistencia, identidad, archivos, notificaciones e integración de recargas</text><path d="M1815,1015 L1815,755" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M1815,755 L1740,755" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="1050" y="1125" font-size="19" font-weight="700" fill="#18232f" text-anchor="middle">La infraestructura depende de los contratos internos; el dominio no importa Firebase.</text><text x="55" y="1180" font-size="17" font-weight="400" fill="#526478" text-anchor="start">Agrupaciones funcionales ilustrativas. Rutas reales: functions/src/{presentation, application, domain, infrastructure}.</text><path d="M950,1190 L950,1240" fill="none" stroke="#344658" stroke-width="2.3" marker-end="url(#arrow)"/><text x="990" y="1224" font-size="18" font-weight="400" fill="#18232f" text-anchor="start">SDK de Firebase / HTTPS · según la operación</text><rect x="50" y="1245" width="280" height="110" rx="9" fill="#eee9ff" stroke="#8191a3" stroke-width="2"/><text x="190.0" y="1275" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Cloud Firestore</text><text x="190.0" y="1303" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">NoSQL documental</text><text x="190.0" y="1326" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Perfiles, viajes y movimientos</text><rect x="354" y="1245" width="280" height="110" rx="9" fill="#fff3d8" stroke="#8191a3" stroke-width="2"/><text x="494.0" y="1275" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Cloud Storage</text><text x="494.0" y="1303" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Archivos</text><text x="494.0" y="1326" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Expedientes y comprobantes</text><rect x="658" y="1245" width="280" height="110" rx="9" fill="#ffeaf0" stroke="#8191a3" stroke-width="2"/><text x="798.0" y="1275" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Firebase Auth</text><text x="798.0" y="1303" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Identidad y sesión</text><text x="798.0" y="1326" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Ingreso y verificación</text><rect x="962" y="1245" width="280" height="110" rx="9" fill="#fff0e5" stroke="#8191a3" stroke-width="2"/><text x="1102.0" y="1275" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">FCM</text><text x="1102.0" y="1303" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Notificaciones push</text><text x="1102.0" y="1326" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Avisos al dispositivo</text><rect x="1266" y="1245" width="280" height="110" rx="9" fill="#e8f5ff" stroke="#8191a3" stroke-width="2"/><text x="1406.0" y="1275" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Mercado Pago</text><text x="1406.0" y="1303" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Recargas de saldo</text><text x="1406.0" y="1326" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Integración configurable</text><rect x="1570" y="1245" width="280" height="110" rx="9" fill="#eaf6ef" stroke="#8191a3" stroke-width="2"/><text x="1710.0" y="1275" font-size="21" font-weight="700" fill="#18232f" text-anchor="middle">Mapas y rutas</text><text x="1710.0" y="1303" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Google / alternativas</text><text x="1710.0" y="1326" font-size="17" font-weight="400" fill="#18232f" text-anchor="middle">Consultados desde la app</text><rect x="50" y="1385" width="1800" height="185" rx="9" fill="#f7f9fb" stroke="#c5ced8" stroke-width="2"/><text x="75" y="1417" font-size="22" font-weight="700" fill="#18232f" text-anchor="start">Cómo leer el gráfico</text><text x="75" y="1450" font-size="19" font-weight="400" fill="#18232f" text-anchor="start">→ Flecha continua: interacción o uso de una capa. Flecha discontinua: dependencia hacia un contrato interno.</text><text x="75" y="1482" font-size="19" font-weight="400" fill="#18232f" text-anchor="start">La app y el panel también leen datos permitidos de Firestore directamente, sujetos a reglas de seguridad.</text><text x="75" y="1514" font-size="19" font-weight="400" fill="#18232f" text-anchor="start">El servidor valida operaciones críticas. Aún recibe los kilómetros del celular; el cálculo independiente de ruta está pendiente.</text><text x="75" y="1546" font-size="19" font-weight="400" fill="#18232f" text-anchor="start">La demo puede simular servicios. Las integraciones reales requieren configuración y despliegue.</text></g></svg>