ght="400" fill="#1b2a3a" text-anchor="start">Gestiona operaciones y consultas</text><rect x="660" y="340" width="400" height="240" rx="15" fill="#eaf7ed" stroke="#6da67b" stroke-width="2"/><text x="684" y="376" font-size="24" font-weight="700" fill="#1b2a3a" text-anchor="start">Backend MotoYa</text><text x="684" y="412" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Firebase Cloud Functions</text><text x="684" y="440" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">TypeScript / Node.js</text><text x="684" y="468" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Valida permisos y reglas críticas</text><text x="684" y="496" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Viajes, tarifas, saldo y comisiones</text><rect x="1220" y="210" width="480" height="165" rx="15" fill="#f1edff" stroke="#9c85bf" stroke-width="2"/><text x="1244" y="246" font-size="24" font-weight="700" fill="#1b2a3a" text-anchor="start">Cloud Firestore</text><text x="1244" y="282" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Base de datos NoSQL documental</text><text x="1244" y="310" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Perfiles, viajes y movimientos</text><rect x="1220" y="465" width="480" height="165" rx="15" fill="#fff3df" stroke="#c0a16b" stroke-width="2"/><text x="1244" y="501" font-size="24" font-weight="700" fill="#1b2a3a" text-anchor="start">Storage y FCM</text><text x="1244" y="537" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Storage: archivos y comprobantes</text><text x="1244" y="565" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">FCM: notificaciones al celular</text><rect x="660" y="695" width="400" height="145" rx="15" fill="#ffedf1" stroke="#c68a9a" stroke-width="2"/><text x="684" y="731" font-size="24" font-weight="700" fill="#1b2a3a" text-anchor="start">Firebase Auth</text><text x="684" y="767" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Identidad y sesión</text><text x="684" y="795" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Verificación de usuarios</text><rect x="80" y="695" width="400" height="145" rx="15" fill="#edf7f1" stroke="#76a38a" stroke-width="2"/><text x="104" y="731" font-size="24" font-weight="700" fill="#1b2a3a" text-anchor="start">Mapas y rutas</text><text x="104" y="767" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Google Maps / alternativas</text><text x="104" y="795" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">La app consulta la ruta</text><rect x="1220" y="695" width="480" height="145" rx="15" fill="#ecf7ff" stroke="#7da5c5" stroke-width="2"/><text x="1244" y="731" font-size="24" font-weight="700" fill="#1b2a3a" text-anchor="start">Mercado Pago</text><text x="1244" y="767" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Integración configurable</text><text x="1244" y="795" font-size="20" font-weight="400" fill="#1b2a3a" text-anchor="start">Recargas de saldo del conductor</text><path d="M480,292 L565,292 L565,400 L660,400" fill="none" stroke="#40556b" stroke-width="2.6" marker-end="url(#a)"/><rect x="502.5" y="240" width="95" height="30" rx="5" fill="white"/><text x="550" y="262" font-size="18" font-weight="400" fill="#40556b" text-anchor="middle">HTTPS</text><path d="M480,547 L565,547 L565,520 L660,520" fill="none" stroke="#40556b" stroke-width="2.6" marker-end="url(#a)"/><rect x="504.5" y="566" width="95" height="30" rx="5" fill="white"/><text x="552" y="588" font-size="18" font-weight="400" fill="#40556b" text-anchor="middle">HTTPS</text><path d="M1060,395 L1135,395 L1135,292 L1220,292" fill="none" stroke="#40556b" stroke-width="2.6" marker-end="url(#a)"/><rect x="1096.0" y="245" width="78" height="30" rx="5" fill="white"/><text x="1135" y="267" font-size="18" font-weight="400" fill="#40556b" text-anchor="middle">Datos</text><path d="M1060,520 L1135,520 L1135,547 L1220,547" fill="none" stroke="#40556b" stroke-width="2.6" marker-end="url(#a)"/><rect x="1070.0" y="563" width="130" height="30" rx="5" fill="white"/><text x="1135" y="585" font-size="18" font-weight="400" fill="#40556b" text-anchor="middle">SDK / HTTPS</text><path d="M860,580 L860,695" fill="none" stroke="#40556b" stroke-width="2.6" marker-end="url(#a)"/><rect x="780.0" y="624" width="160" height="30" rx="5" fill="white"/><text x="860" y="646" font-size="18" font-weight="400" fill="#40556b" text-anchor="middle">Valida identidad</text><path d="M80,320 L35,320 L35,767 L80,767" fill="none" stroke="#40556b" stroke-width="2.6" marker-end="url(#a)"/><path d="M1000,580 L1000,660 L1150,660 L1150,870 L1460,870 L1460,840" fill="none" stroke="#40556b" stroke-width="2.6" marker-end="url(#a)"/><rect x="1122.5" y="848" width="105" height="30" rx="5" fill="white"/><text x="1175" y="870" font-size="18" font-weight="400" fill="#40556b" text-anchor="middle">Recargas</text><rect x="60" y="895" width="1660" height="174" rx="14" fill="#f5f7fa" stroke="#ccd5df" stroke-width="2"/><text x="85" y="931" font-size="23" font-weight="700" fill="#1b2a3a" text-anchor="start">Cómo explicarlo</text><text x="85" y="966" font-size="21" font-weight="400" fill="#1b2a3a" text-anchor="start">La app y el panel son clientes. Solicitan operaciones al servidor, que valida las reglas y utiliza servicios Firebase.</text><text x="85" y="998" font-size="19" font-weight="400" fill="#1b2a3a" text-anchor="start">Las flechas resumen operaciones principales. App y panel también usan Auth y accesos permitidos a Firestore.</text><text x="85" y="1030" font-size="19" font-weight="400" fill="#1b2a3a" text-anchor="start">Serverless: Firebase administra la ejecución. Las capas internas se explican en el gráfico de Arquitectura Limpia.</text></g></svg>